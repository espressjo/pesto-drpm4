# drpm4 configuration. The installed copy lives in $DRPM4_HOME/config/pesto.cfg
# and overrides these defaults (re-running install.sh never overwrites it).

[site]
# Local time zone, used for the noon rollover of the night name.
timezone = America/Toronto
latitude = 45.455556
longitude = -71.152778
height = 1000.0

[level0]
# Length of the proprietary period, in days after the night.
release_days = 366

[instrument]
# Plate scale of PESTO in arcsec per pixel (Astrometry.net solutions give 0.455).
pixel_scale = 0.455

[report]
# Number of frames sampled across an observation for the plots.
nb_frames = 30

[astrometry]
# Directory with the astrometry.net index files (index-52xx-yy.fits, ...).
index_dir = /usr/local/astrometry/data
index_pattern = index-*.fits
# Plate scale range, arcsec per pixel.
scale_low = 0.44
scale_high = 0.47
# Radius (degrees) around the header RA/DEC where the field is searched. Keep it >= 0.1.
position_radius = 0.2
sip_order = 2
# Brightest stars sent to the solver, and detection threshold (sigma above the sky).
max_stars = 50
detect_sigma = 5.0
# Speed: solve one frame, then follow its stars in the next ones and only shift the
# solution. A new full solve is done every resolve_every frames or when following fails.
resolve_every = 25
track_window = 8
track_min_stars = 8
track_max_rms = 0.4
# Give up on a folder after this many failed solves in a row (nothing solved yet).
max_failures = 5
